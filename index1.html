<!DOCTYPE html>
<html lang="fa">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>پروژه آب و هوا</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <div class="container">
            <h1>پروژه پیش‌بینی وضعیت آب و هوا</h1>
            <nav>
                <ul>
                    <li><a href="index.html">خانه</a></li>
                    <li><a href="login.html">ورود / ثبت‌نام</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <section class="search">
        <div class="container">
            <h2>جستجوی وضعیت آب و هوا</h2>
            <form id="search-form">
                <input type="text" id="city-name" placeholder="نام شهر را وارد کنید" required>
                <button type="submit">جستجو</button>
            </form>
        </div>
    </section>

    <section class="weather-info" id="weather-info">
        <!-- اطلاعات وضعیت آب و هوا اینجا نمایش داده می‌شود -->
    </section>

    <section class="forecast" id="forecast">
        <!-- پیش‌بینی وضعیت آب و هوا نمایش داده می‌شود -->
    </section>

    <section class="alerts" id="weather-alerts">
        <!-- اعلان‌های وضعیت آب و هوا اینجا نمایش داده می‌شود -->
    </section>

    <footer>
        <div class="container">
            <p>تمامی حقوق محفوظ است &copy; 2024</p>
        </div>
    </footer>

    <script src="app.js"></script>
</body>
</html>
